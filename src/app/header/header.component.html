<div class="header">
    <div class="container bg-black bg-opacity-50 rounded-top-pill p-2">
        <div class="row">
            <div class="col-12 col-md-2 d-flex flex-wrap justify-content-center justify-content-md-end align-content-center">
                <p class="mb-0 text-end">🇪🇺 <span id="euResetTime"><countdown #euCd [config]="euResetTimerConfig"></countdown></span></p>
            </div>
            <div class="col-12 col-md-7">
                <h1 class="text-center">{{ 'HEADER.TITLE' | translate }}</h1>
                <p class="text-center">{{ 'HEADER.SUBTITLE' | translate }}</p>
            </div>
            <div class="col-12 col-md-2 d-flex flex-wrap justify-content-center justify-content-md-start align-content-center">
                <p class="mb-0 text-start">🇺🇸 <span id="naResetTime"><countdown #naCd [config]="naResetTimerConfig"></countdown></span></p>
            </div>
        </div>
    </div>
</div>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" [href]="baseHref">
            <img src="assets/r14.png" alt="Logo" height="32" class="d-inline-block align-text-top">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" routerLink="/calculator" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">{{ 'HEADER.NAV.CALCULATOR' | translate }}</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/progression-planning" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">{{ 'HEADER.NAV.PROGRESSION' | translate }}</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/faq" routerLinkActive="active">{{ 'HEADER.NAV.FAQ' | translate }}</a>
                </li>
            </ul>
            <div class="ms-auto d-flex align-items-center">
                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        {{ 'HEADER.LANGUAGE' | translate }}: {{ currentLang === 'zh' ? '中文' : 'English' }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" [class.active]="currentLang === 'en'" href="javascript:void(0)" (click)="switchLanguage('en')">English</a></li>
                        <li><a class="dropdown-item" [class.active]="currentLang === 'zh'" href="javascript:void(0)" (click)="switchLanguage('zh')">中文</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
